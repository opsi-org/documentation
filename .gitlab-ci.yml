image: docker.uib.gmbh/opsi/opsidoc-antora:bookworm

stages:
  # - lint
  - setup
  - test
  - build-and-publish

install:
  stage: setup
  cache:
    paths:
    - .cache/npm
  script:
  - &npm_install |
      # Antora
      npm install --no-audit --quiet --no-progress --cache=.cache/npm
      # Antora-UI
      cd antora-ui
      npm install --no-audit --quiet --no-progress --cache=.cache/npm
      cd ..


